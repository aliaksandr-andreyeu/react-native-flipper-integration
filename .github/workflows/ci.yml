name: CI

on:
  pull_request:
    branches: [main, development]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Typecheck library
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --coverage

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Typecheck example
        run: npm run typecheck
        working-directory: example

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install root dependencies
        run: npm ci

      - name: Build library TypeScript
        run: npm run build

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Android unit tests (Robolectric)
        working-directory: example/android
        run: chmod +x gradlew && ./gradlew :react-native-flipper-integration:testDebugUnitTest --no-daemon

      - name: Bundle JavaScript for Android
        working-directory: example
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev true \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Assemble example Debug APK (x86_64)
        working-directory: example/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: iOS gating unit test
        run: |
          clang -framework Foundation -I ios __tests__/ios/gating_test.m -o "${RUNNER_TEMP}/ios-gating-test"
          "${RUNNER_TEMP}/ios-gating-test"

      - name: Validate podspec
        run: pod spec lint FlipperIntegration.podspec --quick --allow-warnings

  all-checks-passed:
    needs: [ci, android-build, ios]
    if: always()
    name: All checks passed
    runs-on: ubuntu-latest
    steps:
      - run: |
          FAILED=""
          # Verify each required job
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            FAILED+="ci "
          fi
          if [[ "${{ needs.android-build.result }}" != "success" ]]; then
            FAILED+="android-build "
          fi
          if [[ "${{ needs.ios.result }}" != "success" ]]; then
            FAILED+="ios "
          fi

          if [[ -n "$FAILED" ]]; then
            echo "The following required jobs failed or were skipped: $FAILED"
            exit 1
          fi
          echo "All required jobs passed!"
