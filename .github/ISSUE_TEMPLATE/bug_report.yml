name: Bug report
description: Report a problem with react-native-flipper-kit
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security issues —
        see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: react-native-flipper-kit version
    validations:
      required: true
  - type: input
    id: rn-version
    attributes:
      label: React Native version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform(s)
      multiple: true
      options:
        - Android
        - iOS
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - New Architecture (TurboModules)
        - Old Architecture (Native Modules)
        - Not sure
    validations:
      required: true
  - type: input
    id: expo
    attributes:
      label: Expo SDK (if applicable)
      placeholder: e.g. 54, or "bare React Native"
  - type: textarea
    id: logs
    attributes:
      label: Logs / build output
      render: shell
