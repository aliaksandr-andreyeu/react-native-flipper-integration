name: E2E Android (Maestro)

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build example APK (bundled JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci
          npm run build
          cd example && npm ci

      - name: Bundle JavaScript for Android
        working-directory: example
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev true \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Assemble Debug APK (x86_64)
        working-directory: example/android
        run: chmod +x gradlew && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: example-debug-apk
          path: example/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  maestro:
    name: Maestro smoke on emulator
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: example-debug-apk
          path: apk

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout-in-minutes: 25
          disable-animations: true
          disable-spell-check: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: |
            set -euxo pipefail
            adb kill-server || true
            adb start-server
            adb wait-for-device
            boot_completed=""
            until [ "$boot_completed" = "1" ]; do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') || true
              sleep 2
            done
            adb install -r -t "$GITHUB_WORKSPACE/apk/app-debug.apk"
            maestro test "$GITHUB_WORKSPACE/example/.maestro"
