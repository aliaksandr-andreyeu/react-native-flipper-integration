version: 2

# NOTE: `react` and `react-native` are fully ignored below and bumped manually — RN
# upgrades are coupled to native code and the peer-dependency range, so they are not
# safe to auto-merge. Trade-off: RN security patches require a manual bump; track RN
# release notes. All other minor/patch updates are grouped into a single weekly PR.
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'development'
    schedule:
      interval: 'weekly'
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']

      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']

  - package-ecosystem: 'npm'
    directory: '/example'
    target-branch: 'development'
    schedule:
      interval: 'weekly'
    groups:
      example-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']

      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'development'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns: ['*']
