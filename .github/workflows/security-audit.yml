name: Security Audit

# The authoritative, blocking npm-audit signal. Runs on a schedule (and on demand)
# so a newly published advisory surfaces as its own failing run instead of turning
# unrelated pull requests red. CI keeps a non-blocking audit step for fast feedback.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/bare-new-arch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/bare-new-arch

      - name: Audit example dependencies
        run: npm audit --audit-level=high
        working-directory: examples/bare-new-arch
