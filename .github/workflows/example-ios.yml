name: Example iOS Build

on:
  pull_request:
    branches: [main, development]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build library TypeScript
        run: npm run build

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Pod install
        working-directory: example/ios
        run: |
          NO_FLIPPER=1 pod install

      - name: Verify Xcode scheme
        working-directory: example/ios
        run: |
          xcodebuild -workspace FlipperIntegrationExample.xcworkspace -list
          xcodebuild -workspace FlipperIntegrationExample.xcworkspace -list | grep -q "FlipperIntegrationExample"

      - name: Build iOS Simulator app
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace FlipperIntegrationExample.xcworkspace \
            -scheme FlipperIntegrationExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
